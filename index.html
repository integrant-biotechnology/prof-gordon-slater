<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#0a0a0c" />

    <!-- Per-page title, description, canonical, robots, Open Graph,
         Twitter and JSON-LD are written here at build time by
         scripts/prerender.mjs from SITE_ROUTES (src/lib/seo.ts +
         src/lib/structured-data.ts). Do not hand-add any of them:
         every page would inherit the duplicate. -->
    <!--app-head-->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts — Fraunces (display) + Inter (body). Fraunces is a variable
         font with optical-size and SOFT axes; we load the variable file
         so the same family covers 14px italic captions through 96px
         hero headlines without extra weight requests. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..70;1,9..144,300..700,30..70&family=Inter:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..70;1,9..144,300..700,30..70&family=Inter:wght@400;500;600&display=swap"
    />

  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
