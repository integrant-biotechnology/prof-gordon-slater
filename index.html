<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Prof Gordon Slater | Personal site</title>
    <meta
      name="description"
      content="The personal site of Prof Gordon Slater — foot &amp; ankle orthopaedic surgeon, Professor at the University of Technology Sydney, and author of Chaos to Creation: Longevity and Regeneration Frontiers (9 April 2026). A factual record of his publications, devices, writing, and support for Australian medical research. Not a clinic."
    />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="canonical" href="https://profgordonslater.com.au/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Prof Gordon Slater" />
    <meta property="og:title" content="Prof Gordon Slater | Personal site" />
    <meta
      property="og:description"
      content="Surgery, research, medical-device development, writing, and support for Australian medical research — and the book Chaos to Creation. A factual personal hub for Prof Gordon Slater. Not a clinic."
    />
    <meta property="og:url" content="https://profgordonslater.com.au/" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:image" content="https://profgordonslater.com.au/portrait-gordon-slater-hero.jpg?v=4" />
    <meta property="og:image:alt" content="Prof Gordon Slater" />
    <meta property="profile:first_name" content="Gordon" />
    <meta property="profile:last_name" content="Slater" />
    <!-- TODO: per-route OG (e.g. swap to the book cover for /book) requires
         pre-rendering / SSR, which this SPA build does not yet do. -->

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prof Gordon Slater | Personal site" />
    <meta
      name="twitter:description"
      content="Surgery, research, medical-device development and writing — a personal hub for Prof Gordon Slater."
    />
    <meta name="twitter:image" content="https://profgordonslater.com.au/portrait-gordon-slater-hero.jpg?v=4" />

    <!-- Fonts — Fraunces (display) + Inter (body). Fraunces is a variable
         font with optical-size and SOFT axes; we load the variable file
         so the same family covers 14px italic captions through 96px
         hero headlines without extra weight requests. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..70;1,9..144,300..700,30..70&family=Inter:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,30..70;1,9..144,300..700,30..70&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- Baseline Person JSON-LD — universal site identity. Crawlers that
         don't execute JS see this; the per-page <JsonLd> components inject
         additional schemas (Book, ItemList of events, ScholarlyArticle
         collection) on the routes they apply to. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Prof Gordon Slater",
        "image": "https://profgordonslater.com.au/portrait-gordon-slater-hero.jpg?v=4",
        "description": "Foot & ankle orthopaedic surgeon, researcher, medical-device innovator and author.",
        "jobTitle": "Specialist Foot & Ankle Orthopaedic Surgeon",
        "url": "https://profgordonslater.com.au",
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "University of New South Wales"
        },
        "worksFor": {
          "@type": "CollegeOrUniversity",
          "name": "University of Technology Sydney"
        },
        "knowsAbout": [
          "Foot and ankle surgery",
          "Minimally invasive orthopaedic surgery",
          "Regenerative orthopaedics",
          "Hyperbaric oxygen therapy",
          "Medical-device innovation",
          "Aging biology",
          "Sports injuries"
        ],
        "sameAs": [
          "https://www.linkedin.com/in/drgordonslater/",
          "https://x.com/drgordonslater",
          "https://www.youtube.com/@profgordonslater",
          "https://www.instagram.com/profgordonslater/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
